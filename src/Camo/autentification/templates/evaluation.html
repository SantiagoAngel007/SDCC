<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación</title>
    <link rel="stylesheet" href="evaluation.css">
</head>
<body>
    <div class="container">
        <h1>Evaluación</h1>
        
        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" value="" class="input-field">
                </div>
                <div class="form-group">
                    <label>Fecha Inicio</label>
                    <input type="date" value="" class="input-field">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Equipo</label>
                    <input type="text" value="" class="input-field">
                </div>
                <div class="form-group">
                    <label>Fecha Final</label>
                    <input type="date" value="" class="input-field">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group full-width">
                    <label>Descripción</label>
                    <textarea class="textarea-field"> </textarea>
                </div>
                <div class="form-group">
                    <label>Duración (Días)</label>
                    <input type="number" value="" class="input-field">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Emisor</label>
                    <input type="text" value="" class="input-field">
                </div>
                <div class="form-group">
                    <label>Último avance realizado</label>
                    <input type="text" class="input-field">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Evaluador</label>
                    <input type="text" value="" class="input-field">
                </div>
                <div class="form-group">
                    <label>Porcentaje Final</label>
                    <div class="percentage-input">
                        <input type="number" value="" class="percentage-field">
                        <span class="percentage-symbol">%</span>
                        <button class="edit-btn">Editar</button>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Encargado</label>
                    <input type="text" value="" class="input-field">
                </div>
                <div class="form-group">
                    <label>Estado Final</label>
                    <select class="select-field">
                        <option>Descripción General</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="form-buttons">
            <button class="btn-cancel">Atrás</button>
            <button class="btn-save">Guardar</button>
        </div>
    </div>
</body>
</html>
