<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">Sign in to your Account</h1>
        <p class="login-subtitle">Enter your email and password to log in</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" value="" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" class="form-input" value="" required>
                </div>
            </div>
            
            <div class="forgot-password">
                <a href="#" onclick="forgotPassword()">Forgot Password ?</a>
            </div>
            
            <button type="submit" class="login-button">Log In</button>
        </form>
        
        <div class="divider">
            <span>Or</span>
        </div>
        
        <button class="social-button google-button" onclick="googleLogin()">
            Continue with Google
        </button>
        
        <button class="social-button facebook-button" onclick="facebookLogin()">
            Continue with Facebook
        </button>
        
        <div class="signup-link">
            Don't have an account? <a href="#" onclick="signUp()">Sign Up</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleButton.textContent = 'Show';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            alert(`Intentando iniciar sesión con:\nEmail: ${email}\nPassword: ${password}`);
        });

        function forgotPassword() {
            alert('Redirigiendo a la página de recuperación de contraseña...');
        }

        function googleLogin() {
            alert('Iniciando sesión con Google...');
        }

        function facebookLogin() {
            alert('Iniciando sesión con Facebook...');
        }

        function signUp() {
            alert('Redirigiendo a la página de registro...');
        }
    </script>
</body>
</html>
